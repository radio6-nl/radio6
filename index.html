<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio 6 | Live Rock</title>
    
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('achtergrond.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: white;
            padding: 20px;
        }

        .player-card {
            background: rgba(0, 0, 0, 0.9);
            padding: 2rem;
            border-radius: 30px;
            text-align: center;
            width: 100%;
            max-width: 420px;
            max-height: 95vh;
            overflow-y: auto;
            border: 2px solid #ff4b2b;
            box-shadow: 0 0 40px rgba(255, 75, 43, 0.6);
            backdrop-filter: blur(10px);
        }

        .player-card::-webkit-scrollbar { width: 5px; }
        .player-card::-webkit-scrollbar-thumb { background: #ff4b2b; border-radius: 10px; }

        .album-art-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 240px;
            margin: 0 auto 20px auto;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #ff4b2b;
            background: #111;
        }

        #album-art {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .live-tag {
            background: #ff4b2b;
            color: white;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }

        audio {
            width: 100%;
            margin: 15px 0;
            filter: invert(100%) hue-rotate(150deg) brightness(1.5);
        }

        .now-playing {
            background: rgba(255, 75, 43, 0.1);
            padding: 1.2rem;
            border-radius: 15px;
            border: 1px dashed #ff4b2b;
            word-wrap: break-word;
        }

        .cc_streaminfo {
            font-weight: bold;
            color: #ff4b2b;
            font-size: 1.2rem;
            display: block;
            margin-top: 8px;
            line-height: 1.3;
        }

        @media (max-width: 480px) {
            .player-card { padding: 1.5rem; }
            .cc_streaminfo { font-size: 1rem; }
            .album-art-container { max-width: 200px; }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <main class="player-card">
        <div class="live-tag">LIVE ON AIR</div>

        <div class="album-art-container">
            <img id="album-art" src="favicon.png" alt="Album Cover / Radio 6">
        </div>
        
        <audio controls>
            <source src="https://eu8.fastcast4u.com/proxy/sixxgod?mp=/stream" type="audio/mpeg">
        </audio>

        <section class="now-playing">
            <small style="opacity: 0.8; text-transform: uppercase; font-weight: bold;">Nu op Radio 6:</small>
            <span class="cc_streaminfo" data-type="song" data-username="sixxgod">Laden...</span>
        </section>
    </main>

    <script language="javascript" type="text/javascript" src="https://eu8.fastcast4u.com/system/streaminfo.js"></script>

    <script>
        function updateAlbumArt() {
            setTimeout(() => {
                let trackTitle = document.querySelector('.cc_streaminfo').innerText;
                
                if (trackTitle && trackTitle !== "Laden..." && trackTitle !== "Radio 6 - Live") {
                    let query = encodeURIComponent(trackTitle);
                    fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`)
                        .then(res => res.json())
                        .then(data => {
                            if (data.results.length > 0) {
                                let imgUrl = data.results[0].artworkUrl100.replace('100x100', '600x600');
                                document.getElementById('album-art').src = imgUrl;
                            } else {
                                // Als er geen cover is, gebruik je eigen logo
                                document.getElementById('album-art').src = 'favicon.png';
                            }
                        })
                        .catch(() => {
                            document.getElementById('album-art').src = 'favicon.png';
                        });
                }
            }, 2500); 
        }

        setInterval(updateAlbumArt, 20000);
        updateAlbumArt();
    </script>

</body>
</html>
